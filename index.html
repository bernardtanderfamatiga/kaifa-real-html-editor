<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAIFA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}body{display:flex;flex-direction:column;height:100vh;background:#111;color:#fff}#t{background:#000;display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #333}#t b{color:#0f8}#t button{background:#1a5c8a;color:#fff;border:0;padding:6px 10px;border-radius:6px}#s{background:orange;color:#000;text-align:center;padding:5px;font-weight:bold;font-size:12px}#e{flex:1;display:flex}#l{background:#222;color:#666;padding:8px 4px;text-align:right;min-width:30px;font-size:13px}#c{flex:1;background:#1e1e1e;color:#ddd;padding:8px;border:0;outline:0;resize:none}#p{flex:1;background:#fff;color:#000;overflow:auto;padding:8px}#search{background:#2b2b2b;display:flex;gap:4px;padding:6px;border-top:2px solid #0f8}#search input{flex:1;background:#000;color:#fff;border:1px solid #444;padding:6px;border-radius:4px}#search button{background:#333;color:#fff;border:0;padding:6px 8px;border-radius:4px}#b{background:#252525;display:flex;border-top:1px solid #444}#b button{flex:1;background:#252525;color:#ccc;border:0;border-right:1px solid #333;padding:10px}</style></head><body>
<div id="t"><b>KAIFA - index.html</b><div><button>◀</button><button onclick="run()">▶</button><button id="up">▲</button><button id="down">▼</button><button>File ▾</button></div></div>
<div id="s">🔥 SPONSORED: Kaifa Tech | Support Us - Fast, Free!</div>
<div id="e"><div id="l">1<br>2<br>3<br>4<br>5</div><textarea id="c"><h1>Hello html</h1><p>html search test</p></textarea><div id="p"></div></div>
<div id="search"><input id="q" placeholder="Search html, <, > symbol ok!"><span id="cnt" style="color:#0f8;font-size:12px">0/0</span><button id="su">▲</button><button id="sd">▼</button><button onclick="q.value='';render()">X</button></div>
<div id="b"><button>↩ Undo</button><button>↪ Redo</button><button style="background:#0a5a9a;color:#fff" onclick="run()">▶ Play</button><button>🗑 Clear</button><button>📝 Notes</button></div>
<script>
const c=document.getElementById('c'),p=document.getElementById('p'),q=document.getElementById('q'),cnt=document.getElementById('cnt');
let m=[],ci=-1;
function render(){
let txt=c.value, s=q.value;
if(!s){p.innerHTML=txt;cnt.textContent='0/0';m=[];return}
let r=new RegExp('('+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
let ls=txt.split('\n'),tot=0,all=[],out='';
ls.forEach((line,li)=>{if(r.test(line)){r.lastIndex=0;let mm;while((mm=r.exec(line))!==null){all.push({li,s:mm.index,e:mm.index+mm[0].length});tot++}
out+=`<div style="background:#2e2e2e;border-left:3px solid #666;padding:1px 4px">${line.replace(r,'<span style="background:red;color:#fff">$1</span>')}</div>`}else out+=`<div style="padding:1px 4px">${line}</div>`});
m=all;if(tot>0&&ci==-1)ci=0;cnt.textContent=tot?`${ci+1}/${tot}`:'0/0';
p.innerHTML=out;
let hls=p.querySelectorAll('span');hls.forEach((e,i)=>{if(i==ci)e.style.background='yellow',e.style.color='#000';});
if(hls[ci])hls[ci].scrollIntoView({block:'center'});
}
c.addEventListener('input',render);q.addEventListener('input',()=>{ci=-1;render()});
document.getElementById('sd').onclick=()=>{if(m.length){ci=(ci+1)%m.length;render()}};
document.getElementById('su').onclick=()=>{if(m.length){ci=(ci-1+m.length)%m.length;render()}};
document.getElementById('down').onclick=document.getElementById('sd').onclick;
document.getElementById('up').onclick=document.getElementById('su').onclick;
function run(){render()}
</script></body></html>
